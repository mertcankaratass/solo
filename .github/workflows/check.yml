    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
    - name: Restore cache 1
