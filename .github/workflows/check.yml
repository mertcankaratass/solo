name: Check
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  prepare:
    name: Check · Prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - run: uvx --from omniship==0.6.0 omniship generate --check
  check-linux-test:
    name: Check · Linux Test
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
    - name: Install Ubuntu system packages
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev mesa-vulkan-drivers libegl1 libegl-mesa0 xvfb
    - name: Restore cache 1
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          packages/native/target/'
        key: linux-test-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
        restore-keys: linux-test-cargo-
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
      with:
        cache: false
        rustflags: ''
    - name: Run Linux Test
      run: uvx --from omniship==0.6.0 omniship run-node --stage check --node linux-test --config omniship.yaml
      env:
        MACOSX_DEPLOYMENT_TARGET: '10.13'
        VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        LIBGL_ALWAYS_SOFTWARE: '1'
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
  check-macos-test:
    name: Check · Macos Test
    needs: prepare
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
