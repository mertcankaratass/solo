          ~/.cargo/git

          packages/native/target/'
        key: macos-test-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
        restore-keys: macos-test-cargo-
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
      with:
        cache: false
        rustflags: ''
    - name: Install cargo-nextest
      uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
