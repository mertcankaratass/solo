# Generated by OmniShip from workflow.py. Do not edit directly.
name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**/*.md'
    - LICENSE
    - '**/*.gitignore'
    - docs/**
  pull_request: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml
  build-bindings:
    name: Build · Bindings
    needs: check
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
    - name: Install Ubuntu system packages
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev
    - name: Restore cache 1
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          packages/native/target/'
        key: ${{ matrix.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
        restore-keys: ${{ matrix.target }}-cargo-
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
      with:
        cache: false
        rustflags: ''
        target: ${{ matrix.target }}
    - name: Run Bindings
      run: uvx --from omniship==0.6.0 omniship run-node --stage build --node bindings --config omniship.yaml --export-artifacts .omniship/handoff/build-bindings
      env:
        MACOSX_DEPLOYMENT_TARGET: '10.13'
        SOLO_TARGET: ${{ matrix.target }}
        OMNISHIP_REF_TYPE: ${{ github.ref_type }}
        OMNISHIP_REF_NAME: ${{ github.ref_name }}
        OMNISHIP_REVISION: ${{ github.sha }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: omniship-build-build-bindings.${{ strategy.job-index }}
        path: .omniship/handoff/build-bindings
        include-hidden-files: true
    strategy:
      fail-fast: false
      matrix:
        runner:
        - macos-latest
        - ubuntu-latest
        - ubuntu-24.04-arm
        - windows-latest
        target:
        - aarch64-apple-darwin
        - x86_64-apple-darwin
        - x86_64-unknown-linux-gnu
        - aarch64-unknown-linux-gnu
        - x86_64-pc-windows-msvc
        - aarch64-pc-windows-msvc
        exclude:
        - runner: macos-latest
          target: x86_64-unknown-linux-gnu
        - runner: macos-latest
          target: aarch64-unknown-linux-gnu
        - runner: macos-latest
          target: x86_64-pc-windows-msvc
        - runner: macos-latest
          target: aarch64-pc-windows-msvc
        - runner: ubuntu-latest
          target: aarch64-apple-darwin
        - runner: ubuntu-latest
          target: x86_64-apple-darwin
        - runner: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - runner: ubuntu-latest
          target: x86_64-pc-windows-msvc
        - runner: ubuntu-latest
          target: aarch64-pc-windows-msvc
        - runner: ubuntu-24.04-arm
          target: aarch64-apple-darwin
        - runner: ubuntu-24.04-arm
          target: x86_64-apple-darwin
        - runner: ubuntu-24.04-arm
          target: x86_64-unknown-linux-gnu
        - runner: ubuntu-24.04-arm
          target: x86_64-pc-windows-msvc
        - runner: ubuntu-24.04-arm
          target: aarch64-pc-windows-msvc
        - runner: windows-latest
          target: aarch64-apple-darwin
        - runner: windows-latest
          target: x86_64-apple-darwin
        - runner: windows-latest
          target: x86_64-unknown-linux-gnu
        - runner: windows-latest
          target: aarch64-unknown-linux-gnu
  build-complete:
    name: Build complete
    needs: build-bindings
    runs-on: ubuntu-latest
    steps:
    - run: echo 'build stage complete'
